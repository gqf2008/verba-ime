name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖（Linux：keyring/cosmic-text/Slint 构建所需）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libfontconfig1-dev libgbm-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontends/macos/ime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release


  frontend-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 打包 IMK .app
        run: bash frontends/macos/ime/scripts/package.sh
      - name: 校验 DMG 安装/卸载脚本
        run: test -x frontends/macos/ime/scripts/install-dmg.command && test -x frontends/macos/ime/scripts/uninstall-dmg.command && test -f frontends/macos/ime/scripts/使用说明.txt && bash -n frontends/macos/ime/scripts/install-dmg.command && bash -n frontends/macos/ime/scripts/uninstall-dmg.command

      - name: 校验 PKG postinstall helper 链路
        run: |
          test -x frontends/macos/ime/scripts/pkg-postinstall.sh
          bash -n frontends/macos/ime/scripts/pkg-postinstall.sh
          grep -q 'pkg-postinstall.sh' frontends/macos/ime/scripts/package-pkg.sh
          grep -q 'open -n' frontends/macos/ime/scripts/pkg-postinstall.sh
          if grep -q 'open -n -W' frontends/macos/ime/scripts/pkg-postinstall.sh; then exit 1; fi
          grep -q -- '--register' frontends/macos/ime/scripts/pkg-postinstall.sh
          frontends/macos/ime/scripts/test-pkg-postinstall.sh

      - name: 校验 DMG staging 布局
        run: |
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp -R frontends/macos/ime/dist/Verba.app "$STAGE/"
          cp frontends/macos/ime/scripts/install-dmg.command "$STAGE/安装.command"
          cp frontends/macos/ime/scripts/uninstall-dmg.command "$STAGE/卸载.command"
          cp frontends/macos/ime/scripts/使用说明.txt "$STAGE/使用说明.txt"
          chmod +x "$STAGE/安装.command" "$STAGE/卸载.command"
          test -d "$STAGE/Verba.app"
          test -x "$STAGE/安装.command"
          test -x "$STAGE/卸载.command"
          test -f "$STAGE/使用说明.txt"
          test ! -e "$STAGE/Applications"
          test ! -L "$STAGE/Applications"

      - name: 校验 .app
        run: test -d frontends/macos/ime/dist/Verba.app && test -x frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-mac && test -x frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-daemon && test -x frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-settings && test -x frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-trigger && test -x frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-register && test -f frontends/macos/ime/dist/Verba.app/Contents/Resources/Icon.pdf && frontends/macos/ime/dist/Verba.app/Contents/MacOS/verba-register --list && ls -la frontends/macos/ime/dist/Verba.app/Contents

      - name: 校验菜单栏图标生成器与产物一致
        run: |
          TMP_ICON="$(mktemp)"
          trap 'unlink "$TMP_ICON"' EXIT
          python3 scripts/gen-macos-icon.py --out "$TMP_ICON"
          cmp "$TMP_ICON" frontends/macos/ime/app/Resources/Icon.pdf
          cmp frontends/macos/ime/app/Resources/Icon.pdf frontends/macos/ime/dist/Verba.app/Contents/Resources/Icon.pdf
          grep -q '/MediaBox \[0 0 18 18\]' frontends/macos/ime/app/Resources/Icon.pdf
          test "$(plutil -extract TISIconIsTemplate raw frontends/macos/ime/dist/Verba.app/Contents/Info.plist)" = "true"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw frontends/macos/ime/dist/Verba.app/Contents/Info.plist)"
          CONNECTION_NAME="$(plutil -extract InputMethodConnectionName raw frontends/macos/ime/dist/Verba.app/Contents/Info.plist)"
          test "$CONNECTION_NAME" = "${BUNDLE_ID}_Connection"
          echo "菜单栏图标生成器/产物/bundle 一致，MediaBox 18x18，模板模式；IMK 连接名符合 bundle id 约定"

      - name: 打包 PKG 并校验
        run: |
          bash frontends/macos/ime/scripts/package-pkg.sh
          PKG="$(ls frontends/macos/ime/dist/Verba-*.pkg | head -1)"
          test -f "$PKG"
          # 校验系统级安装位置、postinstall 内嵌、payload app 签名未破坏（防脚本漂移）
          EXP_ROOT="$(mktemp -d)"
          trap 'rm -rf "$EXP_ROOT"' EXIT
          EXP="$EXP_ROOT/expanded"
          pkgutil --expand-full "$PKG" "$EXP"
          grep -q 'install-location="/Library/Input Methods"' "$EXP/Verba-component.pkg/PackageInfo"
          # 关键：禁止 Installer 把 app 重定位到同 bundle id 的 dist/Verba.app；
          # 否则 PKG receipt 存在但 /Library/Input Methods 为空，菜单不出现。
          # 注意：pkg-info 的 relocatable="false" 默认包也有，不能作为守卫；
          # 必须断言 <relocate> 没有 bundle 子元素（即空 <relocate/>）。
          RELOCATE_BUNDLES="$(xmllint --xpath \
            'count(/*[local-name()="pkg-info"]/*[local-name()="relocate"]/*)' \
            "$EXP/Verba-component.pkg/PackageInfo")"
          test "$RELOCATE_BUNDLES" = "0"
          # 最终 Distribution 也必须没有 relocation；防未来自定义 Distribution 绕过组件检查。
          DIST_RELOCATE_BUNDLES="$(xmllint --xpath \
            'count(/*[local-name()="installer-gui-script"]/*[local-name()="pkg-ref"]/*[local-name()="relocate"]/*)' \
            "$EXP/Distribution")"
          test "$DIST_RELOCATE_BUNDLES" = "0"
          test -x "$EXP/Verba-component.pkg/Scripts/postinstall"
          # 钉住降权行为：launchctl asuser 不降 euid，必须配合 sudo -u（防回退）
          grep -q '/usr/bin/sudo -u' "$EXP/Verba-component.pkg/Scripts/postinstall"
          codesign --verify --deep --strict "$EXP/Verba-component.pkg/Payload/Verba.app"
          echo "PKG 校验通过: $PKG"

  frontend-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontends/windows/ime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  # Rime vendor 获取脚本验证（仅脚本/本文件变更时运行；发布流水线复用同一产物）
  vendor-rime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            vendor:
              - 'scripts/fetch-rime-vendor.*'
      - name: 获取 Rime vendor（Windows）
        if: runner.os == 'Windows' && steps.changes.outputs.vendor == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # gh api 认证（runner 上 gh 不自动读 GITHUB_TOKEN）
        shell: pwsh
        run: ./scripts/fetch-rime-vendor.ps1
      - name: 获取 Rime vendor（macOS）
        if: runner.os == 'macOS' && steps.changes.outputs.vendor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-rime-vendor.sh
      - name: 结构断言
        if: steps.changes.outputs.vendor == 'true'
        shell: bash
        run: |
          test -d vendor/rime/data/opencc
          test -f vendor/rime/data/default.yaml
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f vendor/rime/rime.dll
          else
            test -f vendor/rime/librime.dylib
          fi
          echo "vendor/rime 结构完整"