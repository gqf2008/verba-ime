name: Build & Release

# 打 tag v* 时自动构建 macOS（签名/公证/DMG）+ Windows（Inno Setup 安装包），
# 生成 SHA256SUMS 后发 GitHub Release；也可 workflow_dispatch 干跑（只出 artifact）。
# 与 ../abb、../ossfs 同构；verba 特有：捆绑 Rime（vendor/rime）+ PE 子系统守卫。
#
# 密钥说明（运行时判空，缺失时优雅降级）：
#   APPLE_CERT_P12 / APPLE_CERT_PASSWORD / APPLE_TEAM_ID / APPLE_ID / APPLE_APP_PASSWORD
#     → macOS 签名 + 公证；未配置时产出未签名 DMG（仅 dry-run；tag 发布会显式失败）
#   WIN_SIGN_PFX / WIN_SIGN_PASSWORD
#     → Windows 安装包签名；未配置时跳过（SmartScreen 会提示）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────── macOS（Apple Silicon）───────────────────────────
  macos:
    runs-on: macos-14 # Apple Silicon（arm64），与本地 aarch64 产物一致
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 导入 Developer ID 证书（临时钥匙串）
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "::warning::APPLE_CERT_P12 未配置——产出未签名产物（仅 dry-run）"
            echo "IDENTITY=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp /tmp/temp.keychain
          # 关键：关闭临时钥匙串自动锁（默认 5 分钟）——冷构建（vendor 下载 + 3 crate 编译）
          # 远超 5 分钟，若自动锁会在签名时弹密码框永久挂起（ossfs 曾卡 5h44m）
          security set-keychain-settings -lut 21600 /tmp/temp.keychain
          security default-keychain -s /tmp/temp.keychain
          security unlock-keychain -p temp /tmp/temp.keychain
          security import /tmp/cert.p12 -k /tmp/temp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp /tmp/temp.keychain
          IDENTITY=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: 获取 Rime vendor（librime.dylib + data/）
        env:
          GH_TOKEN: ${{ github.token }} # gh api 认证（runner 上 gh 不自动读 GITHUB_TOKEN）
        run: bash scripts/fetch-rime-vendor.sh

      - name: 组装 Verba.app（构建 + 版本注入 + Rime 捆绑 + ad-hoc 签名）
        run: bash frontends/macos/ime/scripts/package.sh

      - name: 逐二进制签名（hardened runtime + timestamp）
        if: env.IDENTITY != ''
        run: |
          # 公证前 bundle 内每个 Mach-O（含 rime/*.dylib）都必须带时间戳签名
          find frontends/macos/ime/dist/Verba.app/Contents/MacOS -type f \( -perm -111 -o -name "*.dylib" \) \
            -exec codesign --force --options runtime --timestamp --sign "$IDENTITY" {} \;
          codesign --force --options runtime --timestamp --sign "$IDENTITY" frontends/macos/ime/dist/Verba.app
          codesign --verify --deep --strict --verbose=2 frontends/macos/ime/dist/Verba.app

      - name: 公证 + staple .app
        if: env.IDENTITY != ''
        run: |
          ditto -c -k --keepParent frontends/macos/ime/dist/Verba.app /tmp/Verba-notarize.zip
          set +e
          NOTARY_OUT="$(xcrun notarytool submit /tmp/Verba-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait 2>&1)"
          NOTARY_RC=$?
          set -e
          printf '%s\n' "$NOTARY_OUT"
          if [ $NOTARY_RC -ne 0 ]; then
            SUB_ID="$(printf '%s\n' "$NOTARY_OUT" | sed -n 's/.*id: \([0-9a-f-]\{36\}\).*/\1/p' | head -1)"
            if [ -n "$SUB_ID" ]; then
              echo "::error::.app 公证失败（submission=$SUB_ID），详细原因：" >&2
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" 2>&1 | sed 's/^/  /' || true
            fi
            exit $NOTARY_RC
          fi
          xcrun stapler staple frontends/macos/ime/dist/Verba.app
          spctl --assess --type execute --verbose=4 frontends/macos/ime/dist/Verba.app || true

      - name: Rime 冒烟（daemon 从 .app 副本启动，不写坏已签名 bundle）
        run: |
          cargo build --release -p verba-cli
          # 必须用 .app 副本冒烟：daemon 默认把 user_data/ 写在 exe 同目录 rime/ 下，
          # 直接运行会改动已签名 bundle 破坏 seal → 后续 DMG 公证报 "signature of the
          # binary is invalid"（32849155322 实测：verba-mac 签名无效）。
          SMOKE_APP="$(mktemp -d)/Verba.app"
          cp -R frontends/macos/ime/dist/Verba.app "$SMOKE_APP"
          "$SMOKE_APP/Contents/MacOS/verba-daemon" >/dev/null 2>&1 &
          DPID=$!
          trap 'kill $DPID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            ./target/release/verba-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          OUT="$(./target/release/verba-cli rime nishishui luna_pinyin_simp 2>&1 || true)"
          if ! printf '%s' "$OUT" | grep -q "你是谁"; then
            echo "::error::Rime 冒烟失败：$OUT" >&2
            exit 1
          fi
          echo "Rime 冒烟通过：$OUT"
          OUT2="$(./target/release/verba-cli rime biang luna_pinyin_simp 2>&1 || true)"
          BIANG="$(python3 -c 'import sys; sys.stdout.write(chr(0x30EDD))')"
          if ! printf '%s' "$OUT2" | grep -qF "$BIANG"; then
            echo "::error::biang 词条冒烟失败：$OUT2" >&2
            exit 1
          fi
          echo "biang 词条冒烟通过：$OUT2"

      - name: 打包 DMG（有身份时签名 + 公证 + staple）
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 显式校验 bundle 签名未被冒烟等步骤破坏（seal 失效会直接导致 DMG 公证 Invalid）
          codesign --verify --deep --strict frontends/macos/ime/dist/Verba.app
          mkdir -p dmg-staging
          cp -R frontends/macos/ime/dist/Verba.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          # 一键安装脚本（issue #48 项 3）：双击拷贝 app 到 ~/Library/Input Methods
          # 并调 app 内 verba-register 注册/启用输入源（签名/公证覆盖整个 DMG）。
          cp frontends/macos/ime/scripts/install-dmg.command dmg-staging/安装.command
          chmod +x dmg-staging/安装.command
          hdiutil create -volname "Verba" -srcfolder dmg-staging -ov -format UDZO "Verba-$VERSION.dmg"
          if [ -n "$IDENTITY" ]; then
            # DMG 也要签名 + 公证（分发的盘片本身要过 Gatekeeper）
            codesign --force --sign "$IDENTITY" --timestamp "Verba-$VERSION.dmg"
            set +e
            NOTARY_OUT="$(xcrun notarytool submit "Verba-$VERSION.dmg" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait 2>&1)"
            NOTARY_RC=$?
            set -e
            printf '%s\n' "$NOTARY_OUT"
            if [ $NOTARY_RC -ne 0 ]; then
              # 公证被拒（status: Invalid）时打印详细原因，避免盲查
              SUB_ID="$(printf '%s\n' "$NOTARY_OUT" | sed -n 's/.*id: \([0-9a-f-]\{36\}\).*/\1/p' | head -1)"
              if [ -n "$SUB_ID" ]; then
                echo "::error::DMG 公证失败（submission=$SUB_ID），详细原因：" >&2
                xcrun notarytool log "$SUB_ID" \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" 2>&1 | sed 's/^/  /' || true
              fi
              exit $NOTARY_RC
            fi
            xcrun stapler staple "Verba-$VERSION.dmg"
            spctl --assess --type open --context context:primary-signature -v "Verba-$VERSION.dmg" || true
          fi

      - name: 校验（tag 发布必须已签名）
        if: startsWith(github.ref, 'refs/tags/') && env.IDENTITY == ''
        run: |
          echo "::error::tag 发布缺少签名身份（APPLE_* secrets 未配置）" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: Verba-*.dmg
          if-no-files-found: error

  # ─────────────────────────── Windows（x64 + Inno Setup）───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建 release（workspace：daemon/settings/cli）
        shell: pwsh
        run: cargo build --release

      - name: 构建 release（Windows 前端：DLL + reg + trigger）
        shell: pwsh
        run: cargo build --release --manifest-path frontends/windows/ime/Cargo.toml

      - name: PE 子系统守卫（daemon 必须 GUI 子系统，防控制台回归）
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes('target\release\verba-daemon.exe')
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 0x44)   # OptionalHeader+Subsystem
          if ($sub -ne 2) { throw "verba-daemon.exe subsystem=$sub（期望 2=GUI）；release 仍会弹控制台" }
          Write-Host "PE 守卫通过：subsystem=$sub (GUI)"

      - name: 安装 Inno Setup（含中文语言文件补丁）
        shell: pwsh
        run: |
          # choco 安装不会刷新本步骤的 PATH（进程环境在步骤启动时继承），也建不出
          # 已在 PATH 目录的 ISCC shim——直接用安装目录的全路径解析，存进 GITHUB_ENV
          # 供「构建安装包」步骤使用（复审 sweep：裸 ISCC.exe 在未预装镜像上必失败）。
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          if (-not (Test-Path $isccPath)) { throw "ISCC.exe 未找到（$isccPath）" }
          # 写 GITHUB_ENV 必须用裸字符串进管道；Write-Host 走信息流（stream 6）不
          # 进管道，Out-File 会写空（复审 HIGH——下一步 $env:ISCC 为空致构建失败）。
          "ISCC=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path "$langDir\ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
          }
          Write-Host "ISCC found: $isccPath"

      - name: 获取 Rime vendor（rime.dll + data/）
        env:
          GH_TOKEN: ${{ github.token }} # gh api 认证（runner 上 gh 不自动读 GITHUB_TOKEN）
        shell: pwsh
        run: ./scripts/fetch-rime-vendor.ps1

      - name: 获取 OCR vendor（PP-OCRv5 模型）
        shell: pwsh
        run: ./scripts/fetch-ocr-vendor.ps1

      - name: 构建安装包
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          # 用安装步骤解析出的全路径 ISCC（choco 装的 ISCC 不在 PATH 上）
          & $env:ISCC /DMyAppVersion=$version frontends\windows\installer\verba-ime.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（exit=$LASTEXITCODE）" }

      - name: Rime 冒烟（daemon + vendor/rime）
        shell: pwsh
        run: |
          $env:VERBA_RIME_DLL = "$pwd\vendor\rime\rime.dll"
          $env:VERBA_RIME_SHARED = "$pwd\vendor\rime\data"
          $env:VERBA_RIME_USER = "$pwd\vendor\rime\user_data"
          $p = Start-Process -FilePath "target\release\verba-daemon.exe" -WindowStyle Hidden -PassThru
          try {
            # 等 daemon socket 就绪（30×1s 重试，与 macOS 冒烟对称；防慢 runner flake）
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              & "target\release\verba-cli.exe" ping *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "daemon ping 30s 未就绪" }
            $out = & "target\release\verba-cli.exe" rime nishishui luna_pinyin_simp 2>&1 | Out-String
            if ($out -notmatch "你是谁") { throw "Rime 冒烟失败: $out" }
            Write-Host "Rime 冒烟通过: $($out.Trim())"
            $out2 = & "target\release\verba-cli.exe" rime biang luna_pinyin_simp 2>&1 | Out-String
            # U+30EDD 属增补平面：[char] 数值转换对 >0xFFFF 抛 OverflowException，须用 ConvertFromUtf32
            $biang = [string][char]::ConvertFromUtf32(0x30EDD)
            if ($out2 -notmatch [regex]::Escape($biang)) { throw "biang 词条冒烟失败: $out2" }
            Write-Host "biang 词条冒烟通过: $($out2.Trim())"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      # Windows 代码签名：有证书时启用，否则跳过（secrets 不能出现在 if 条件里）
      - name: Sign installer (optional)
        shell: pwsh
        env:
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_SIGN_PFX)) {
            Write-Host "未配置 WIN_SIGN_PFX，跳过 Windows 代码签名"
            exit 0
          }
          # [IO.File]::WriteAllBytes 返回 void：赋给 $pfx 会得到 $null，signtool 的 /f
          # 收到空路径而失败（PowerShell 对原生命令丢弃 $null 实参）。路径与写文件分两行。
          $pfx = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_PFX))
          $exe = Get-ChildItem frontends\windows\installer\output\verba-ime-setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到待签名安装包 frontends\windows\installer\output\verba-ime-setup-*.exe" }
          # signtool 不保证在 PATH：从 Windows Kits 安装目录解析（取最新版本 x64）。
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { $signtool = "signtool" } # 回退到 PATH（本地自托管 runner）
          & $signtool sign /f $pfx /p $env:WIN_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign 失败（exit=$LASTEXITCODE）" }
          Remove-Item $pfx -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: frontends/windows/installer/output/verba-ime-setup-*.exe
          if-no-files-found: error

  # ─────────────────────────── 汇总发 Release ───────────────────────────
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') # 只有打 tag 才发 Release；手动跑只出产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum Verba-*.dmg verba-ime-setup-*.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" -f target_commitish="${{ github.sha }}" \
            -q '.body' > /tmp/notes-generated.md
          printf '%s\n' '> ⚠️ **macOS 版仅支持 Apple Silicon（M 系列，arm64）**；Intel Mac 请勿下载。' | cat - /tmp/notes-generated.md > /tmp/notes-final.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/notes-final.md
          fail_on_unmatched_files: true
