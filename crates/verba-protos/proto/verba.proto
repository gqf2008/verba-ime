syntax = "proto3";

package verba;

// ---------------------------------------------------------------------------
// Verba IPC 协议（M1 范围：LLM 直输链路 + 候选融合）
// 传输：interprocess local_socket（Windows 命名管道 / Unix Domain Socket）
// 帧：u32 LE 长度前缀 + 本 Protobuf message
// ---------------------------------------------------------------------------

// ---------- 请求 ----------
message Request {
  uint64 id = 1;
  oneof kind {
    Ping ping = 10;
    SetMode set_mode = 11;
    GetConfig get_config = 12;
    SetConfig set_config = 13;
    LlmGenerate llm_generate = 20;
    LlmCancel llm_cancel = 21;
    LlmCandidates llm_candidates = 22;
    RimeCandidates rime_candidates = 23;
    TtsSynthesize tts_synthesize = 24;
    OcrRecognize ocr_recognize = 25;
    AsrTranscribe asr_transcribe = 26;
    ApiKeySet api_key_set = 27;
    RimeInstallExtra rime_install_extra = 28;
    ListModels list_models = 29;
  }
}

message Ping {}

message SetMode {
  // normal | ai | voice | ocr
  string mode = 1;
}

message GetConfig {}

message SetConfig {
  map<string, string> values = 1;
}

message LlmGenerate {
  string prompt = 1;
  optional string system = 2;
  optional float temperature = 3;
  optional int32 max_tokens = 4;
  bool stream = 5;
  // 多模态图像（vision）：mime 如 image/png，字节内容。
  optional bytes image = 6;
  optional string image_mime = 7;
  // 会话标识：多轮上下文按此分组隔离（每控制器/前端生成唯一值）。
  // 0 = 旧客户端/未分配的默认共享槽（向后兼容，行为同修复前的单一全局历史）。
  uint64 session_id = 8;
}

message LlmCancel {}

// 候选融合：拼音态请求 LLM 补充候选（词库候选之外的语境候选）。
message LlmCandidates {
  string pinyin = 1;
  repeated string dictionary = 2;
  int32 max_candidates = 3;
}

// 可选 Rime 引擎（config 引擎=rime）：查询拼音/五笔候选（daemon 内 librime）。
message RimeCandidates {
  string input = 1;
  string schema = 2;
  int32 max_candidates = 3;
}

// 安装生僻字扩展：把 Verba 补充词条（scripts/rime-extra/custom_phrase.txt，
// 编译期内嵌）合入用户 Rime 目录并重建引擎（下一次查询触发重新部署）。
message RimeInstallExtra {}

// 列出 LLM 模型（OpenAI 兼容 GET /models；provider 当前仅 DeepSeek）。
message ListModels {}

message ModelList {
  repeated string models = 1;
}

// ---------- 响应 ----------
message Response {
  uint64 id = 1;
  oneof kind {
    Pong pong = 2;
    Ok ok = 3;
    Error error = 4;
    Text text = 5;
    Config config = 6;
    Audio audio = 7;
    ModelList model_list = 8;
  }
}

message Pong {
  string version = 1;
}

message Ok {}

message Error {
  int32 code = 1;
  string message = 2;
}

message Text {
  string text = 1;
}

message Config {
  map<string, string> values = 1;
}

// TTS（文字 → 语音音频）：provider 由 config tts_provider 决定（mock|edge…）。
message TtsSynthesize {
  string text = 1;
  // 可选覆盖 config tts_voice（如 edge 的语音名 zh-CN-XiaoxiaoNeural）。
  optional string voice = 2;
}

// 音频输出：format 为 wav / mp3 等，data 为音频字节（WAV 含头）。
message Audio {
  string format = 1;
  bytes data = 2;
}

// OCR（图片/截图 → 文字）：provider 由 config ocr_provider 决定（mock|windows…）。
message OcrRecognize {
  bytes image = 1;
}

// ASR（语音 → 文字）：provider 由 config asr_provider 决定（mock|openai…）。
message AsrTranscribe {
  bytes audio = 1;
}

// 设置/清除 API Key（空字符串 = 删除）：写系统密钥库并热更新 daemon 内存，
// 无需重启 daemon 即可让 LLM / 在线 ASR / 在线 TTS 生效。
message ApiKeySet {
  string key = 1;
}

// ---------- 流式事件（服务端 -> 客户端，按请求 id 关联） ----------
message StreamEvent {
  uint64 id = 1;
  oneof kind {
    Chunk chunk = 2;
    Final final = 3;
    Error error = 4;
    Candidates candidates = 5;
  }
}

message Chunk {
  string text = 1;
}

message Final {
  string text = 1;
}

// 候选融合增量：candidates 为本次新增候选（追加语义），done=true 表示生成结束。
// pinyin 回显请求拼音，供客户端按当前组合校验过期结果。
message Candidates {
  string pinyin = 1;
  repeated string candidates = 2;
  bool done = 3;
}
