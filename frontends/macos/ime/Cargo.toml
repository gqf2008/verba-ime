[workspace]

[package]
name = "verba-ime-macos"
version = "0.2.5"
edition = "2021"
publish = false
description = "Verba macOS IMK 前端（全 Rust）：objc2 + InputMethodKit 绑定 + 连接 daemon"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "verba-mac"
path = "src/main.rs"

[dependencies]
verba-core = { path = "../../../crates/verba-core" }
verba-ipc = { path = "../../../crates/verba-ipc" }
verba-protos = { path = "../../../crates/verba-protos" }
verba-config = { path = "../../../crates/verba-config" }
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# exception 特性：catch_void/host_call 捕获 IMK 客户端包装器抛出的 ObjC
# 异常（unmarkText 等不被实现的选择器），防止异常穿透 Rust 帧在清理途中
# abort——真机崩溃根因之一，正式依赖非调试开关。
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-input-method-kit = "0.3"
# verba-register（src/bin/）：CFString/CFArray/CFURL 类型封装，配合 Carbon
# framework 的 TextInputSources FFI（TISRegisterInputSource / TISEnableInputSource）。
core-foundation = "0.10"
